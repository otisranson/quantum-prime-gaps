# OpenEvolve configuration for evolving quantum_prime_gaps.py's frequency-
# reconstruction step. See initial_program.py and evaluator.py for what's being
# evolved and how it's scored. Uses Gemini's free tier via its OpenAI-compatible
# endpoint by default -- see quantum_evolve/README section in the repo README
# for how to point this at a different provider.
max_iterations: 100
checkpoint_interval: 10

llm:
  primary_model: "gemini-2.5-flash-lite"
  primary_model_weight: 0.8
  secondary_model: "gemini-2.5-flash"
  secondary_model_weight: 0.2
  api_base: "https://generativelanguage.googleapis.com/v1beta/openai/"
  temperature: 0.7
  max_tokens: 16000
  timeout: 120

prompt:
  system_message: >
    You are an expert in spectral methods and numerical forecasting. You are
    improving `reconstruct`, the frequency-truncation-and-inverse-DFT step used
    to forecast prime gaps from a known Fourier spectrum (classical np.fft.fft,
    or a real quantum-circuit QFT spectrum, both fed through the same
    function). Prime gaps are not periodic, so naive top-k magnitude
    truncation currently loses to two trivial baselines (repeat the mean known
    gap; repeat the last known gap) on held-out backward verification. Try
    ideas like: soft/weighted frequency shrinkage instead of hard top-k
    truncation, windowing or detrending the known window before transforming,
    blending the spectral forecast with a naive baseline, or a
    magnitude-and-phase-aware selection instead of magnitude-only. The
    function must remain a mathematically valid inverse DFT: called with
    top_k=None it must still exactly reproduce the known samples it was built
    from -- this is checked and any candidate that violates it scores zero.

database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  similarity_threshold: 0.99

evaluator:
  timeout: 60
  parallel_evaluations: 3

diff_based_evolution: true
max_code_length: 20000
